name: rebuild Verglas public records

on:
  push:
    branches: [main]
    paths:
      - 'residents/**'
      - 'tools/generate-directory.mjs'
      - 'tools/generate-mail-ledger.mjs'
      - 'tools/lib.mjs'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate directory
        run: node tools/generate-directory.mjs

      - name: Generate mail ledger
        run: node tools/generate-mail-ledger.mjs

      - name: Commit generated records when changed
        run: |
          if git diff --quiet -- DIRECTORY.md THE_CROSSING.md; then
            echo "Public records are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DIRECTORY.md THE_CROSSING.md
          git commit -m "chore: rebuild Verglas public records"
          git push
